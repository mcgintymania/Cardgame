<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="felt" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#2f8463"/><stop offset=".65" stop-color="#1e5a43"/><stop offset="1" stop-color="#0f2f22"/>
    </radialGradient>
    <linearGradient id="brass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0cf86"/><stop offset=".5" stop-color="#d4a94f"/><stop offset="1" stop-color="#9c7027"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffaf0"/><stop offset="1" stop-color="#ece0c6"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="512" height="512" fill="#16110e"/>
  <circle cx="256" cy="256" r="236" fill="url(#felt)"/>
  <circle cx="256" cy="256" r="236" fill="none" stroke="url(#brass)" stroke-width="14"/>
  <circle cx="256" cy="256" r="214" fill="none" stroke="#e2bd68" stroke-opacity=".35" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
  <!-- back card: a heart -->
  <g transform="rotate(-14 256 300)" filter="url(#sh)">
    <rect x="150" y="128" width="164" height="232" rx="18" fill="url(#card)"/>
    <text x="170" y="182" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#b3262e">A</text>
    <path transform="translate(-34 -8)" d="M232 250 c-22 -30 -64 -16 -58 18 c5 28 58 62 58 62 c0 0 53 -34 58 -62 c6 -34 -36 -48 -58 -18z" fill="#b3262e"/>
  </g>
  <!-- front card: a spade -->
  <g transform="rotate(12 256 300)" filter="url(#sh)">
    <rect x="200" y="140" width="164" height="232" rx="18" fill="url(#card)"/>
    <text x="220" y="194" font-family="Georgia, serif" font-size="46" font-weight="700" fill="#1c1714">A</text>
    <path d="M282 214 c0 0 -62 46 -62 84 c0 26 30 38 52 20 c-4 22 -12 34 -22 40 h64 c-10 -6 -18 -18 -22 -40 c22 18 52 6 52 -20 c0 -38 -62 -84 -62 -84z" fill="#1c1714"/>
  </g>
</svg>
