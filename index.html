<style>
/* Card Club design system.
   Layout concept: a lamp-lit members' card room — dark walnut walls, one pool of
   light over a green baize table, brass trim and ivory cards. The table is the
   hero; every other screen is the club's lounge around it.
   Single committed dark look (deliberate), so color-scheme is dark on :root. */
:root {
  color-scheme: dark;
  /* room */
  --room: #16110e;
  --room-2: #201813;
  --panel: #261d17;
  --panel-2: #2f241c;
  --line: rgba(233, 214, 172, 0.14);
  --line-2: rgba(233, 214, 172, 0.26);
  /* ink */
  --ink: #f1e8d6;
  --ink-2: #bcae94;
  --ink-3: #8a7d68;
  /* brass */
  --brass: #d4a94f;
  --brass-hi: #f0cf86;
  --brass-lo: #9c7027;
  --brass-ink: #1d140c;
  /* table */
  --felt-hi: #2f8463;
  --felt: #1e5a43;
  --felt-lo: #113526;
  --wood: #4a2c1b;
  --wood-lo: #26160d;
  --wood-mid: #6b4429;
  /* cards */
  --card: #faf4e6;
  --card-2: #ece0c6;
  --card-ink: #1c1714;
  --card-red: #b3262e;
  --back: #6a1d25;
  /* semantic */
  --hot: #e0563f;
  --warn: #e1a33b;
  --good: #6fbf8b;
  /* type */
  --f-display: 'Limelight', 'Didot', 'Bodoni 72', Georgia, serif;
  --f-ui: 'Barlow Semi Condensed', 'Arial Narrow', 'Roboto Condensed', system-ui, sans-serif;
  --f-card: 'Cormorant Garamond', 'Baskerville', Georgia, serif;
  /* scale */
  --r: 12px;
  --gutter-l: max(16px, env(safe-area-inset-left, 0px));
  --gutter-r: max(16px, env(safe-area-inset-right, 0px));
  --tabbar-h: 62px;
}

html, body, #root { height: 100%; }
body {
  background: var(--room);
  background-image: radial-gradient(ellipse 90% 60% at 50% -10%, #3a2a1f 0%, transparent 60%);
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-ui);
  font-size: 16px;
  line-height: 1.45;
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; }
button:not(:disabled) { cursor: pointer; }
:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.boot { display: grid; place-items: center; height: 100%; color: var(--ink-3); font-family: var(--f-ui); letter-spacing: .2em; text-transform: uppercase; font-size: 13px; }

/* ---------------------------------------------------------------- type */
.display { font-family: var(--f-display); font-weight: 400; letter-spacing: .01em; line-height: 1.05; text-wrap: balance; margin: 0; }
.h-xl { font-size: clamp(2.3rem, 8vw, 3.6rem); }
.h-lg { font-size: clamp(1.9rem, 6vw, 2.6rem); }
.h-sec { font-size: 13px; text-transform: uppercase; letter-spacing: .16em; color: var(--ink-2); font-weight: 600; margin: 0 0 12px; }
.eyebrow { margin: 0 0 6px; font-size: 12px; text-transform: uppercase; letter-spacing: .18em; color: var(--brass); font-weight: 600; }
.lede { color: var(--ink-2); font-size: 17px; max-width: 60ch; margin: 10px 0 0; }
.muted { color: var(--ink-2); }
.small { font-size: 14px; }
.fine { font-size: 13px; color: var(--ink-3); margin: 12px 0 0; }
.empty { color: var(--ink-3); margin: 0; font-size: 15px; }
.brand-mark { font-family: var(--f-display); color: var(--brass-hi); font-size: 22px; letter-spacing: .03em; }

/* ------------------------------------------------------------- buttons */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  border-radius: 10px; border: 1px solid transparent; font-weight: 600;
  text-transform: uppercase; letter-spacing: .08em; white-space: nowrap;
  transition: transform .12s, filter .12s, background .12s;
}
.btn:active:not(:disabled) { transform: translateY(1px) scale(.98); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-sm { padding: 7px 12px; font-size: 13px; }
.btn-md { padding: 11px 18px; font-size: 15px; min-height: 44px; }
.btn-lg { padding: 14px 26px; font-size: 17px; min-height: 52px; }
.btn-brass {
  background: linear-gradient(180deg, var(--brass-hi), var(--brass) 45%, var(--brass-lo));
  color: var(--brass-ink); border-color: #f7dea0;
  box-shadow: 0 1px 0 rgba(255,255,255,.4) inset, 0 6px 16px -6px rgba(212,169,79,.6);
}
.btn-brass:hover:not(:disabled) { filter: brightness(1.07); }
.btn-ghost { background: rgba(255,255,255,.03); border-color: var(--line-2); color: var(--ink); }
.btn-ghost:hover:not(:disabled) { background: rgba(255,255,255,.07); }
.btn-felt { background: var(--felt); border-color: var(--felt-hi); }
.btn-danger { background: linear-gradient(180deg, #c2443a, #8f2621); border-color: #e0706a; color: #fff6ea; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 16px; }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px;
  background: rgba(255,255,255,.04); border: 1px solid var(--line); font-size: 18px; color: var(--ink);
}
.icon-btn:hover { background: rgba(255,255,255,.08); }

/* ----------------------------------------------------------------- tags */
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; vertical-align: middle; white-space: nowrap; }
.tag-muted { border: 1px solid var(--line-2); color: var(--ink-2); }
.tag-warn { background: rgba(225,163,59,.14); color: #f0c06d; border: 1px solid rgba(225,163,59,.35); }
.tag-ok { background: rgba(111,191,139,.14); color: #95d6aa; border: 1px solid rgba(111,191,139,.35); }
.tag-brass { background: rgba(212,169,79,.16); color: var(--brass-hi); }

/* ----------------------------------------------------------------- shell */
.shell { min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px var(--gutter-r) 10px var(--gutter-l);
  background: rgba(22,17,14,.88); backdrop-filter: blur(8px); border-bottom: 1px solid var(--line);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--room); }
.topbar-me { background: none; border: 0; padding: 0; border-radius: 50%; }
.screen { padding-left: var(--gutter-l); padding-right: var(--gutter-r); }
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
  display: grid; grid-template-columns: repeat(5, 1fr);
  padding: 6px var(--gutter-r) calc(6px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: rgba(18,13,10,.94); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
}
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 0; font-size: 12px; letter-spacing: .06em; text-transform: uppercase; color: var(--ink-3); border-radius: 10px; }
.tab-glyph { font-size: 19px; line-height: 1; }
.tab.is-on { color: var(--brass-hi); }
.rail { display: none; }
.page { max-width: 980px; margin: 0 auto; padding-block: 22px calc(var(--tabbar-h) + 40px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 26px; }
.page-head { display: flex; flex-direction: column; }

@media (min-width: 900px) {
  .shell { display: grid; grid-template-columns: 232px 1fr; }
  .topbar, .tabbar { display: none; }
  .rail {
    display: flex; flex-direction: column; gap: 22px; position: sticky; top: 0; height: 100vh;
    padding: 26px 16px; border-right: 1px solid var(--line); background: rgba(14,10,8,.55);
  }
  .rail-brand { padding: 0 10px; }
  .rail-nav { display: flex; flex-direction: column; gap: 2px; }
  .rail-item { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; background: none; border: 0; text-align: left; font-size: 16px; color: var(--ink-2); }
  .rail-item:hover { background: rgba(255,255,255,.04); color: var(--ink); }
  .rail-item.is-on { background: rgba(212,169,79,.12); color: var(--brass-hi); }
  .rail-glyph { width: 20px; text-align: center; }
  .rail-me { margin-top: auto; display: flex; align-items: center; gap: 10px; background: none; border: 1px solid var(--line); border-radius: 12px; padding: 8px 10px; text-align: left; }
  .screen { padding-left: 40px; padding-right: 40px; }
  .page { padding-block: 40px 60px; }
}

/* ---------------------------------------------------------------- panels */
.panel { background: linear-gradient(180deg, var(--panel), var(--room-2)); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; min-width: 0; }
.panel-quiet { background: transparent; border-style: dashed; }
.block { display: flex; flex-direction: column; min-width: 0; }
.two-col { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .two-col { grid-template-columns: 1fr 1fr; } }
.sec-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.statgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 14px; margin: 0; }
.statgrid dt { font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); }
.statgrid dd { margin: 2px 0 0; font-size: 28px; font-weight: 600; font-variant-numeric: tabular-nums; }
.statgrid dd.small { font-size: 18px; padding-top: 8px; }

.spotlight { position: relative; display: grid; place-items: center; padding: 14px; }
.spotlight::before { content: ""; position: absolute; inset: -20% -30%; background: radial-gradient(closest-side, rgba(240,207,134,.22), transparent 70%); pointer-events: none; }
.spotlight .avatar { position: relative; border-radius: 50%; box-shadow: 0 0 0 3px var(--brass), 0 12px 30px rgba(0,0,0,.6); }

/* ------------------------------------------------------------------ home */
.home-hero { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; }
.home-hero-text { min-width: 0; display: flex; flex-direction: column; gap: 10px; }
.home-hero-art .avatar { width: 104px; height: 104px; }
@media (min-width: 700px) { .home-hero-art .avatar { width: 150px; height: 150px; } .home-hero { gap: 34px; } }
.balances { display: flex; flex-wrap: wrap; gap: 8px; }
.balance { display: inline-flex; align-items: center; gap: 6px; padding: 5px 10px 5px 6px; border-radius: 999px; background: rgba(0,0,0,.3); border: 1px solid var(--line); font-size: 14px; }
.balance em { font-style: normal; font-size: 11px; text-transform: uppercase; letter-spacing: .1em; color: var(--ink-3); }
.balance.is-locked { opacity: .8; }
.play-cta { align-self: flex-start; margin-top: 4px; }
@media (max-width: 520px) {
  .home-hero { grid-template-columns: 1fr; justify-items: center; text-align: center; }
  .home-hero-text { align-items: center; }
  .play-cta { align-self: stretch; }
  .balances { justify-content: center; }
}

.modes { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 700px) { .modes { grid-template-columns: 1fr 1fr; } }
.mode {
  display: grid; grid-template-columns: 110px 1fr; gap: 14px; align-items: center; text-align: left;
  padding: 16px; border-radius: 16px; border: 1px solid var(--line-2); min-width: 0;
  transition: transform .15s, border-color .15s;
}
.mode:hover { transform: translateY(-2px); border-color: var(--brass); }
.mode-take2 { background: radial-gradient(ellipse at 30% 30%, var(--felt-hi), var(--felt) 50%, var(--felt-lo)); }
.mode-poker { background: radial-gradient(ellipse at 30% 30%, #5d2a2e, #3a1a1d 60%, #24100f); }
.mode-art { position: relative; height: 90px; display: flex; justify-content: center; align-items: center; }
.mode-art .pc { position: absolute; }
.tilt-l { transform: translateX(-16px) rotate(-12deg); }
.tilt-r { transform: translateX(16px) rotate(9deg); }
.mode-text { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; min-width: 0; }
.mode-name { font-family: var(--f-display); font-size: 26px; line-height: 1; }
.mode-desc { color: #e3dac6; font-size: 15px; }

.locked-list, .more-list { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.locked-row, .more-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 16px; border: 0; border-bottom: 1px solid var(--line); background: rgba(255,255,255,.015); text-align: left; }
.locked-row:last-child, .more-row:last-child { border-bottom: 0; }
.locked-row span, .more-row span { display: flex; flex-direction: column; min-width: 0; }
.locked-row small, .more-row small { color: var(--ink-3); font-size: 14px; }
.more-row:hover { background: rgba(255,255,255,.05); }
.chev { font-size: 22px; color: var(--ink-3); transition: transform .2s; }
.chev.is-open { transform: rotate(90deg); }
.soon { padding-top: 6vh; display: flex; flex-direction: column; gap: 8px; }
.soon-actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 18px; }

/* ----------------------------------------------------------- onboarding */
.onboard { min-height: 100%; display: grid; place-items: center; padding: 28px var(--gutter-r) 40px var(--gutter-l); }
.onboard-card { width: 100%; max-width: 860px; }
.onboard-title { font-size: clamp(3rem, 13vw, 5.4rem); color: var(--brass-hi); text-shadow: 0 2px 0 #5b3d14, 0 0 40px rgba(240,207,134,.25); }
.onboard-grid { display: grid; gap: 20px; margin-top: 24px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .onboard-grid { grid-template-columns: 260px 1fr; gap: 36px; align-items: start; } .onboard-preview { position: sticky; top: 30px; } }
.onboard-preview { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.preview-name { font-family: var(--f-display); font-size: 24px; margin: 0; color: var(--ink); }
.onboard-form { display: flex; flex-direction: column; gap: 18px; min-width: 0; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field-label { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-2); }
.field-hint { font-size: 13px; color: var(--ink-3); }
.input { background: rgba(0,0,0,.35); border: 1px solid var(--line-2); border-radius: 10px; padding: 12px 14px; color: var(--ink); font: inherit; font-size: 18px; }
.input:focus { outline: none; border-color: var(--brass); box-shadow: 0 0 0 3px rgba(212,169,79,.2); }
.local-note { font-size: 14px; color: var(--ink-3); margin: 0; }
.avatar-editor { display: flex; flex-direction: column; gap: 14px; }
.swatches { border: 0; padding: 0; margin: 0; min-width: 0; }
.swatches legend { font-size: 13px; text-transform: uppercase; letter-spacing: .14em; color: var(--ink-2); margin-bottom: 8px; padding: 0; }
.swatch-row, .choice-row { display: flex; flex-wrap: wrap; gap: 8px; }
.swatch { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.12); padding: 0; }
.swatch.is-on { border-color: var(--brass-hi); box-shadow: 0 0 0 3px rgba(240,207,134,.25); }
.choice { padding: 7px 12px; border-radius: 999px; border: 1px solid var(--line-2); background: rgba(255,255,255,.03); font-size: 14px; }
.choice.is-on { background: rgba(212,169,79,.18); border-color: var(--brass); color: var(--brass-hi); }
.profile-head { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }

/* -------------------------------------------------------- setting rows */
.row-setting { display: flex; align-items: center; justify-content: space-between; gap: 14px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.row-setting:last-child { border-bottom: 0; }
.row-col { flex-wrap: wrap; }
.row-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1 1 200px; }
.row-label { font-weight: 600; font-size: 16px; }
.row-hint { font-size: 14px; color: var(--ink-3); }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line-2); border-radius: 10px; padding: 3px; gap: 3px; background: rgba(0,0,0,.25); }
.seg-btn { border: 0; background: none; padding: 7px 12px; border-radius: 7px; font-size: 14px; color: var(--ink-2); }
.seg-btn.is-on { background: linear-gradient(180deg, var(--brass-hi), var(--brass)); color: var(--brass-ink); font-weight: 600; }
.switch { appearance: none; -webkit-appearance: none; width: 48px; height: 28px; border-radius: 999px; background: #3b3029; border: 1px solid var(--line-2); position: relative; flex: none; margin: 0; transition: background .15s; }
.switch::before { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--ink-2); transition: transform .15s, background .15s; }
.switch:checked { background: var(--felt); border-color: var(--felt-hi); }
.switch:checked::before { transform: translateX(20px); background: var(--brass-hi); }
input[type="range"] { accent-color: var(--brass); width: min(220px, 50%); }
.stepper { display: inline-flex; align-items: center; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; flex: none; }
.stepper button { width: 38px; height: 36px; background: rgba(255,255,255,.04); border: 0; font-size: 18px; }
.stepper button:disabled { opacity: .3; }
.stepper output { min-width: 3.2ch; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.back-picks { display: flex; gap: 10px; }
.back-pick { background: none; border: 2px solid transparent; border-radius: 8px; padding: 3px; }
.back-pick.is-on { border-color: var(--brass-hi); }
.back-navy { --back: #1d2b4d; }
.back-forest { --back: #1c4535; }
.back-oxblood { --back: #6a1d25; }

/* ---------------------------------------------------------------- setup */
.roster { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 280px), 1fr)); }
.opp { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 12px; text-align: left; border-radius: 14px; border: 1px solid var(--line); background: rgba(255,255,255,.02); transition: border-color .15s, background .15s; min-width: 0; }
.opp:hover { background: rgba(255,255,255,.05); }
.opp.is-on { border-color: var(--brass); background: rgba(212,169,79,.08); }
.opp .avatar { border-radius: 50%; }
.opp-text { display: flex; flex-direction: column; min-width: 0; }
.opp-text small { color: var(--ink-3); font-size: 14px; }
.opp-style { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--brass); margin-top: 3px; }
.opp-check { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 50%; border: 1px solid var(--line-2); color: var(--ink-3); }
.opp.is-on .opp-check { background: var(--brass); color: var(--brass-ink); border-color: var(--brass-hi); font-weight: 700; }
.disclosure { display: flex; justify-content: space-between; align-items: center; gap: 12px; text-align: left; width: 100%; padding: 14px 16px; border-radius: var(--r); border: 1px solid var(--line-2); background: rgba(255,255,255,.03); margin-bottom: 10px; }
.disclosure span:first-child { display: flex; flex-direction: column; min-width: 0; }
.disclosure small { color: var(--ink-3); font-size: 14px; }
.start-bar {
  position: sticky; bottom: calc(var(--tabbar-h) + env(safe-area-inset-bottom, 0px) + 8px); z-index: 5;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  padding: 12px 14px; border-radius: 16px; background: rgba(26,19,15,.95); border: 1px solid var(--line-2);
  box-shadow: 0 12px 30px rgba(0,0,0,.5);
}
@media (min-width: 900px) { .start-bar { bottom: 16px; } }
.rules-legend { font-size: 14px; color: var(--ink-3); margin: 0 0 6px; }
.rules-h { font-size: 13px; text-transform: uppercase; letter-spacing: .16em; color: var(--brass); margin: 18px 0 2px; }
.values { padding-top: 12px; }
.values-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(54px, 1fr)); gap: 6px; margin: 8px 0; }
.value-cell { display: flex; flex-direction: column; align-items: center; padding: 6px 0; border-radius: 8px; background: var(--card); color: var(--card-ink); }
.value-cell b { font-family: var(--f-card); font-size: 20px; line-height: 1; }
.value-cell span { font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.value-cell.is-mult { background: var(--brass); }
.value-cell.is-hot span { color: var(--card-red); }
.rules-summary ul { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; }

/* ------------------------------------------------------------------ sheet */
.sheet-scrim { position: fixed; inset: 0; z-index: 60; background: rgba(8,5,4,.62); backdrop-filter: blur(3px); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease-out; }
.sheet {
  width: 100%; max-height: 90%; overflow: auto; overscroll-behavior: contain;
  background: linear-gradient(180deg, var(--panel-2), var(--room-2)); border: 1px solid var(--line-2);
  border-radius: 20px 20px 0 0; padding: 4px var(--gutter-r) calc(18px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  box-shadow: 0 -20px 50px rgba(0,0,0,.6); animation: rise .24s cubic-bezier(.2,.8,.2,1);
}
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 14px 0 8px; position: sticky; top: -4px; background: var(--panel-2); z-index: 1; }
.sheet-head h2 { margin: 0; font-family: var(--f-display); font-weight: 400; font-size: 24px; }
.sheet-body { display: flex; flex-direction: column; gap: 12px; }
.sticky-actions { position: sticky; bottom: calc(-18px - env(safe-area-inset-bottom, 0px)); background: linear-gradient(transparent, var(--room-2) 30%); padding: 18px 0 4px; margin-top: 4px; }
@media (min-width: 700px) {
  .sheet-scrim { align-items: center; }
  .sheet { width: min(540px, 92vw); border-radius: 20px; padding: 4px 24px 22px; }
  .sheet-wide { width: min(720px, 94vw); }
}
@keyframes rise { from { transform: translateY(40px); opacity: 0; } }
@keyframes fade { from { opacity: 0; } }

/* ============================================================ PLAYING CARDS */
.pc {
  --cw: 62px;
  width: var(--cw); aspect-ratio: 5 / 7; border-radius: calc(var(--cw) * .09);
  position: relative; flex: none; container-type: inline-size; user-select: none;
}
.pc-face {
  background: linear-gradient(160deg, var(--card) 0%, var(--card) 55%, var(--card-2) 100%);
  color: var(--card-ink);
  box-shadow: 0 0 0 1px rgba(60,40,20,.25) inset, 0 1px 0 rgba(255,255,255,.7) inset, 0 3px 8px rgba(0,0,0,.4);
}
.pc-face.is-red { color: var(--card-red); }
.pc-corner { position: absolute; display: flex; flex-direction: column; align-items: center; line-height: .82; }
.pc-corner b { font-family: var(--f-card); font-weight: 700; font-size: 30cqw; letter-spacing: -.03em; }
.pc-corner i { font-style: normal; font-size: 21cqw; margin-top: 2cqw; }
.pc-tl { top: 6cqw; left: 7cqw; }
.pc-br { bottom: 6cqw; right: 7cqw; transform: rotate(180deg); }
.pc-pip { position: absolute; inset: 0; display: grid; place-items: center; font-size: 56cqw; line-height: 1; padding-top: 4cqw; }
.pc-court { position: absolute; inset: 20cqw 17cqw; display: grid; }
.pc-court-frame {
  border: 1px solid currentColor; border-radius: 6cqw; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: repeating-linear-gradient(135deg, transparent 0 4cqw, rgba(212,169,79,.18) 4cqw 5cqw), rgba(212,169,79,.12);
  box-shadow: 0 0 0 2cqw var(--card) inset, 0 0 0 2.6cqw rgba(156,112,39,.55) inset;
}
.pc-court-frame b { font-family: var(--f-card); font-weight: 700; font-size: 40cqw; line-height: .9; }
.pc-court-frame i { font-style: normal; font-size: 22cqw; line-height: 1; }
.pc-court-frame small { font-size: 9cqw; text-transform: uppercase; letter-spacing: .14em; margin-top: 3cqw; font-weight: 600; }
@container (max-width: 44px) {
  .pc-court-frame small { display: none; }
  .pc-pip { font-size: 46cqw; padding-top: 18cqw; }
  .pc-court { inset: 34cqw 14cqw 10cqw; }
  .pc-court-frame b { font-size: 34cqw; }
  .pc-court-frame i { display: none; }
  .pc-br { display: none; }
}
.pc-back {
  background:
    radial-gradient(circle at 50% 50%, rgba(255,255,255,.08), transparent 60%),
    repeating-linear-gradient(45deg, rgba(255,232,180,.09) 0 1.5px, transparent 1.5px 7px),
    repeating-linear-gradient(-45deg, rgba(255,232,180,.09) 0 1.5px, transparent 1.5px 7px),
    var(--back);
  box-shadow: 0 0 0 1px rgba(0,0,0,.4) inset, 0 3px 8px rgba(0,0,0,.45);
  border: calc(var(--cw) * .045) solid #efe4c9;
}
.pc-back-inner { position: absolute; inset: 6cqw; border: 1px solid rgba(240,207,134,.55); border-radius: 5cqw; display: grid; place-items: center; }
.pc-back-mono { font-family: var(--f-display); color: var(--brass-hi); font-size: 24cqw; opacity: .85; }
.pc-empty { border: 2px dashed rgba(255,255,255,.18); background: rgba(0,0,0,.12); }

/* ================================================================== TABLE */
.table-screen {
  height: 100%; min-height: 560px; display: flex; flex-direction: column; overflow: hidden;
  background:
    radial-gradient(ellipse 70% 45% at 50% 40%, rgba(255,214,140,.16), transparent 70%),
    radial-gradient(ellipse at 50% 120%, #0b0806, transparent 60%),
    linear-gradient(180deg, #241a14, #140f0c);
  --hand-cw: clamp(54px, 15.5vw, 86px);
  --pile-cw: clamp(62px, 17vw, 96px);
}
.table-screen.cards-lg { --hand-cw: clamp(64px, 18.5vw, 100px); --pile-cw: clamp(70px, 19vw, 108px); }
.table-bar { display: flex; align-items: center; gap: 10px; padding: 8px var(--gutter-r) 6px var(--gutter-l); flex: none; }
.table-title { flex: 1; display: flex; flex-direction: column; line-height: 1.1; min-width: 0; }
.table-title .display { font-size: 21px; color: var(--brass-hi); }
.table-title small { color: var(--ink-3); font-size: 13px; letter-spacing: .04em; }
.table-tools { display: flex; gap: 6px; }

.stage { position: relative; flex: 1 1 auto; min-height: 300px; margin: 6px var(--gutter-r) 0 var(--gutter-l); }
.felt {
  position: absolute; inset: 15% 7% 8%; border-radius: 50% / 46%;
  background: radial-gradient(ellipse at 50% 38%, var(--felt-hi) 0%, var(--felt) 48%, var(--felt-lo) 100%);
  box-shadow:
    0 0 0 9px var(--wood), 0 0 0 10px var(--wood-mid), 0 0 0 13px var(--wood-lo),
    inset 0 0 0 2px rgba(240,207,134,.25), inset 0 10px 40px rgba(0,0,0,.35), inset 0 -20px 50px rgba(0,0,0,.4),
    0 30px 60px rgba(0,0,0,.6);
}
.felt::before { content: ""; position: absolute; inset: 7%; border-radius: inherit; border: 1px solid rgba(240,207,134,.16); pointer-events: none; }
.felt::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; opacity: .35; mix-blend-mode: overlay;
  background: repeating-radial-gradient(circle at 30% 20%, rgba(255,255,255,.05) 0 1px, transparent 1px 3px);
}
.felt-inner { position: absolute; inset: 0; display: grid; place-items: center; padding-top: 30%; }
@media (min-width: 900px) { .felt-inner { padding-top: 12%; } }
.piles { display: flex; align-items: center; justify-content: center; gap: clamp(10px, 4vw, 28px); }
.pile { display: flex; flex-direction: column; align-items: center; gap: 6px; }
.pile .stack { position: relative; }
.pile .pc { --cw: var(--pile-cw); }
.pile-label { font-size: 12px; letter-spacing: .1em; text-transform: uppercase; color: rgba(241,232,214,.7); font-variant-numeric: tabular-nums; }
.stack-2, .stack-3 { position: absolute !important; top: 0; left: 0; }
.stack-2 { transform: translate(-2px, -2px); }
.stack-3 { transform: translate(-4px, -4px); }
.discard-pile .under { position: absolute; top: 0; left: 0; transform: rotate(-9deg) translate(-4px, 2px); filter: brightness(.86); }
.landing { animation: land .32s .22s cubic-bezier(.2,.9,.3,1.2) backwards; }
@keyframes land { from { transform: scale(1.25) rotate(8deg); opacity: 0; } }

.center-info { display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 54px; }
.suit-medal {
  width: 52px; height: 52px; border-radius: 50%; display: grid; place-items: center;
  background: radial-gradient(circle at 40% 35%, #fffaf0, var(--card-2)); color: var(--card-ink);
  box-shadow: 0 0 0 3px var(--brass), 0 0 0 5px rgba(0,0,0,.35), 0 6px 14px rgba(0,0,0,.4);
  font-size: 30px; line-height: 1;
}
.suit-medal.is-red { color: var(--card-red); }
.suit-medal.is-called { animation: called 1.4s ease-out; box-shadow: 0 0 0 3px var(--brass-hi), 0 0 0 5px rgba(0,0,0,.35), 0 0 24px rgba(240,207,134,.6); }
@keyframes called { 0% { transform: scale(.4) rotate(-90deg); } 40% { transform: scale(1.25) rotate(8deg); } 100% { transform: none; } }
.medal-label { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: rgba(241,232,214,.75); }
.pending-chip {
  min-width: 46px; height: 46px; border-radius: 50%; display: grid; place-items: center; padding: 0 4px;
  font-weight: 700; font-size: 18px; color: #fff4e4; font-variant-numeric: tabular-nums;
  background: radial-gradient(circle, #b8332d 55%, #8a1f1b 56%);
  box-shadow: 0 0 0 3px #f1e8d6 inset, 0 0 0 5px #b8332d inset, 0 4px 12px rgba(0,0,0,.5);
  border: 3px dashed #f1e8d6; animation: chip .4s cubic-bezier(.2,.9,.3,1.4);
}
.pending-chip.is-skip { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; background: radial-gradient(circle, #2d4f8f 55%, #1d3561 56%); }
@keyframes chip { from { transform: translateY(-30px) scale(.6) rotate(-40deg); opacity: 0; } }
.direction { font-size: 22px; color: var(--brass-hi); }

.toasts { position: absolute; top: 27%; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; align-items: center; gap: 4px; z-index: 4; width: max-content; max-width: 86%; pointer-events: none; }
.toast { padding: 5px 12px; border-radius: 999px; font-size: 14px; font-weight: 600; background: rgba(14,10,8,.86); border: 1px solid var(--line-2); animation: toast .25s ease-out; text-align: center; }
.toast-hot { border-color: rgba(224,86,63,.7); color: #ffd2c4; }
.toast-good { border-color: rgba(240,207,134,.7); color: var(--brass-hi); }
@keyframes toast { from { transform: translateY(-8px) scale(.95); opacity: 0; } }

/* seats */
.seat { position: absolute; transform: translate(-50%, -50%); display: flex; flex-direction: column; align-items: center; gap: 3px; width: 84px; z-index: 3; }
.seat-avatar { position: relative; border-radius: 50%; padding: 2px; background: #3a2b20; box-shadow: 0 0 0 2px #5a4632, 0 6px 14px rgba(0,0,0,.5); transition: box-shadow .2s; }
.seat-avatar .avatar { display: block; border-radius: 50%; }
.seat.is-active .seat-avatar { box-shadow: 0 0 0 2px var(--brass-hi), 0 0 0 5px rgba(240,207,134,.25), 0 0 22px rgba(240,207,134,.5); animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 2px var(--brass-hi), 0 0 0 7px rgba(240,207,134,.12), 0 0 30px rgba(240,207,134,.35); } }
.seat-plate { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 1px 6px; width: 100%; padding: 4px 7px 5px; border-radius: 9px; background: rgba(14,10,8,.86); border: 1px solid var(--line); font-size: 12px; line-height: 1.2; }
.seat-name { font-weight: 600; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seat-meta { display: flex; align-items: center; gap: 4px; justify-self: end; font-variant-numeric: tabular-nums; }
.mini-fan { position: relative; width: 16px; height: 13px; }
.mini-fan span { position: absolute; bottom: 0; left: calc(var(--i) * 1.6px); width: 8px; height: 12px; border-radius: 2px; background: var(--back); border: 1px solid #efe4c9; transform: rotate(calc(var(--i) * 6deg - 10deg)); transform-origin: bottom center; }
.seat-plate .meter { grid-column: 1; }
.seat-pts { font-size: 12px; font-weight: 600; font-variant-numeric: tabular-nums; justify-self: end; }
.seat-pts small { color: var(--ink-3); font-weight: 400; }
.seat.is-out .seat-avatar { filter: grayscale(1) brightness(.6); }
.seat.is-out .seat-plate { opacity: .55; }
.think { position: absolute; top: -6px; right: -10px; display: flex; gap: 2px; padding: 4px 6px; border-radius: 10px; background: var(--card); box-shadow: 0 2px 6px rgba(0,0,0,.4); }
.think i { width: 4px; height: 4px; border-radius: 50%; background: var(--card-ink); animation: dot 1s infinite; }
.think i:nth-child(2) { animation-delay: .15s; }
.think i:nth-child(3) { animation-delay: .3s; }
@keyframes dot { 50% { opacity: .2; transform: translateY(-2px); } }
.ko-stamp {
  position: absolute; inset: 50% auto auto 50%; transform: translate(-50%, -50%) rotate(-14deg);
  font-family: var(--f-display); font-size: 20px; color: #ff6a55; padding: 0 6px; border: 2px solid #ff6a55; border-radius: 6px;
  background: rgba(30,8,6,.55); letter-spacing: .06em; animation: stamp .5s cubic-bezier(.3,1.6,.4,1) backwards;
}
.ko-stamp-lg { font-size: 26px; position: static; transform: rotate(-12deg); align-self: center; }
@keyframes stamp { from { transform: translate(-50%, -50%) rotate(-14deg) scale(3); opacity: 0; } }
.ko-stamp-lg { animation-name: stamp-lg; animation-delay: calc(var(--i, 0) * 120ms + 400ms); }
@keyframes stamp-lg { from { transform: rotate(-12deg) scale(3); opacity: 0; } }

.meter { display: block; height: 4px; border-radius: 4px; background: rgba(255,255,255,.1); overflow: hidden; }
.meter > span { display: block; height: 100%; background: linear-gradient(90deg, var(--good), #a7cf7b); border-radius: inherit; transition: width .6s ease; }
.meter.is-warn > span { background: linear-gradient(90deg, #d8b14d, var(--warn)); }
.meter.is-danger > span { background: linear-gradient(90deg, #e77b4a, var(--hot)); }

/* me */
.me {
  flex: none; position: relative; z-index: 5;
  padding: 8px var(--gutter-r) calc(10px + env(safe-area-inset-bottom, 0px)) var(--gutter-l);
  background: linear-gradient(180deg, rgba(20,15,12,0), rgba(20,15,12,.92) 22%, #120d0a);
}
.me-bar { display: flex; justify-content: space-between; align-items: center; gap: 12px; max-width: 900px; margin: 0 auto; }
.me-id { display: flex; align-items: center; gap: 10px; min-width: 0; }
.me-id .avatar { border-radius: 50%; box-shadow: 0 0 0 2px #5a4632; flex: none; }
.me.is-turn .me-id .avatar { box-shadow: 0 0 0 2px var(--brass-hi), 0 0 16px rgba(240,207,134,.5); }
.me-id > span { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.me-id b { font-size: 16px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.me-id .meter { width: 90px; }
.me-scores { display: flex; gap: 14px; }
.me-scores > span { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; font-variant-numeric: tabular-nums; }
.me-scores small { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); }
.me-scores b { font-size: 22px; }
.me-scores em { font-style: normal; font-size: 11px; color: var(--brass-hi); }
.me-scores .is-mult b { color: var(--brass-hi); }
.status { text-align: center; margin: 8px 0 2px; font-size: 15px; color: var(--ink-2); min-height: 1.45em; }
.status.is-turn { color: var(--brass-hi); font-weight: 600; font-size: 17px; }
.move-error { text-align: center; margin: 0; font-size: 14px; color: #ffb4a3; }
.actions { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; min-height: 44px; margin: 6px 0 4px; }
.actions:empty { min-height: 0; margin: 0; }

.hand { display: flex; justify-content: center; align-items: flex-end; padding-top: 24px; min-height: calc(var(--hand-cw) * 1.4 + 26px); container-type: inline-size; max-width: 900px; margin: 0 auto; }
.hand .empty { align-self: center; text-align: center; }
.hand-card { background: none; border: 0; padding: 0; border-radius: 8px; transition: transform .18s cubic-bezier(.2,.8,.2,1), filter .18s; animation: dealin .38s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 55ms); position: relative; }
.hand-card .pc { --cw: var(--hand-cw); }
.hand-card + .hand-card { margin-left: clamp(calc(var(--hand-cw) * -.74), calc((100cqw - var(--n) * var(--hand-cw)) / (var(--n) - 1)), 6px); }
.hand-card.is-playable { transform: translateY(-10px); }
.hand-card.is-playable .pc { box-shadow: 0 0 0 1px rgba(60,40,20,.25) inset, 0 0 0 2px var(--brass-hi), 0 8px 18px rgba(0,0,0,.5), 0 0 18px rgba(240,207,134,.35); }
.hand-card.is-selected { transform: translateY(-26px); z-index: 2; }
.hand-card.is-selected .pc { box-shadow: 0 0 0 3px var(--brass-hi), 0 14px 26px rgba(0,0,0,.6), 0 0 26px rgba(240,207,134,.6); }
.hand-card.is-dim { filter: brightness(.62) saturate(.7); }
.hand-card.is-drawn::after { content: "New"; position: absolute; top: -18px; left: 50%; transform: translateX(-50%); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--brass-hi); }
.hand-card.is-shake { animation: shake .35s; }
@media (hover: hover) { .hand-card.is-playable:hover { transform: translateY(-18px); } }
@keyframes dealin { from { transform: translateY(60px) rotate(8deg); opacity: 0; } }
@keyframes shake { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

.flier { position: fixed; z-index: 50; pointer-events: none; transform: translate(-50%, -50%); }
.flier .pc { --cw: calc(var(--pile-cw) * .8); }

.ko-flash { position: fixed; inset: 0; z-index: 55; display: grid; place-content: center; justify-items: center; gap: 6px; pointer-events: none; background: radial-gradient(circle, rgba(60,10,6,.55), transparent 70%); animation: fade .2s; }
.ko-word { font-family: var(--f-display); font-size: clamp(2.6rem, 12vw, 5rem); color: #ff6a55; border: 4px solid #ff6a55; padding: 2px 18px; border-radius: 10px; transform: rotate(-8deg); text-shadow: 0 4px 20px rgba(0,0,0,.6); animation: thud .5s cubic-bezier(.3,1.6,.4,1); background: rgba(20,6,4,.6); }
.ko-name { font-size: 20px; font-weight: 600; color: var(--ink); text-shadow: 0 2px 8px #000; }
@keyframes thud { from { transform: rotate(-8deg) scale(2.6); opacity: 0; } }

.suit-pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.suit-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px; border-radius: 14px; background: var(--card); color: var(--card-ink); border: 2px solid transparent; }
.suit-btn.is-red { color: var(--card-red); }
.suit-btn:hover, .suit-btn:focus-visible { border-color: var(--brass); }
.suit-sym { font-size: 40px; line-height: 1; }
.suit-btn span:not(.suit-sym) { font-weight: 600; }
.suit-btn small { color: #6b5e4a; font-size: 13px; }

/* results */
.score-lines { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.score-line { display: grid; grid-template-columns: auto 1fr auto; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid var(--line); animation: rise .35s backwards; animation-delay: calc(var(--i) * 90ms); }
.score-line .avatar { border-radius: 50%; }
.score-line.is-out-first { border-color: rgba(240,207,134,.5); background: rgba(212,169,79,.08); }
.score-line.is-ko { border-color: rgba(224,86,63,.45); background: rgba(120,24,16,.18); }
.sl-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.sl-top { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.sl-calc { color: var(--ink-2); font-variant-numeric: tabular-nums; }
.sl-calc b { color: var(--ink); }
.sl-hand { display: flex; flex-wrap: wrap; gap: 3px; }
.sl-total { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; }
.sl-nums { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-2); }
.sl-nums b { color: var(--ink); font-size: 16px; }
.standings { overflow-x: auto; }
.standings table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.standings th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-weight: 600; padding: 6px 8px; border-bottom: 1px solid var(--line-2); white-space: nowrap; }
.standings td { padding: 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
.standings .num { text-align: right; }
.standings .place { font-family: var(--f-display); color: var(--brass-hi); }
.standings tr.is-ko td { color: var(--ink-3); }
.st-player { display: inline-flex; align-items: center; gap: 8px; }
.st-player .avatar { border-radius: 50%; }
.winner { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 2px; padding-bottom: 8px; }

@media (min-width: 900px) {
  .table-screen { --hand-cw: 84px; --pile-cw: 100px; }
  .table-screen.cards-lg { --hand-cw: 98px; --pile-cw: 112px; }
  .stage { max-width: 1100px; width: calc(100% - 80px); margin: 0 auto; }
  .seat { width: 104px; }
  .suit-medal { width: 62px; height: 62px; font-size: 36px; }
}
@media (max-height: 700px) and (max-width: 899px) {
  .table-screen { --hand-cw: clamp(48px, 13.5vw, 70px); --pile-cw: clamp(54px, 15vw, 80px); }
  .hand { padding-top: 18px; }
}

/* reduced motion: chosen in Settings, or the device setting by default */
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation: none !important; transition: none !important; }
@media (prefers-reduced-motion: reduce) {
  .shell *, .onboard * { animation: none !important; transition: none !important; }
}

/* last card */
.last-call {
  min-height: 44px; padding: 10px 16px; border-radius: 10px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; font-size: 14px;
  background: rgba(212,169,79,.08); color: var(--brass-hi); border: 1.5px dashed var(--brass);
}
.last-call.is-on { background: var(--good); color: #10241a; border: 1.5px solid #a5e2bb; box-shadow: 0 0 18px rgba(111,191,139,.45); }
.last-badge {
  position: absolute; left: 50%; bottom: -6px; transform: translateX(-50%); white-space: nowrap;
  padding: 1px 6px; border-radius: 999px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
  background: var(--good); color: #10241a; box-shadow: 0 2px 6px rgba(0,0,0,.5); animation: chip .35s cubic-bezier(.2,.9,.3,1.4);
}

/* ================================================================== POKER */
.statgrid dd small { font-size: 15px; color: var(--ink-3); font-weight: 400; }
.poker-screen { --board-cw: clamp(40px, 11.2vw, 74px); }
.poker-center { padding-top: 6%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; }
.board { display: flex; gap: clamp(3px, 1.2vw, 8px); }
.board .pc { --cw: var(--board-cw); }
.board .is-dim-card { filter: brightness(.55) saturate(.6); transition: filter .4s; }
.is-win-card { box-shadow: 0 0 0 2px var(--brass-hi), 0 0 16px rgba(240,207,134,.6), 0 3px 8px rgba(0,0,0,.4) !important; }
.pot { display: flex; align-items: center; gap: 8px; min-height: 28px; }
.pot-label { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(241,232,214,.75); }
.result-line { margin: 0; min-height: 1.4em; font-weight: 600; color: var(--brass-hi); text-align: center; font-size: 15px; padding: 0 12%; text-shadow: 0 1px 4px rgba(0,0,0,.6); }

.chips { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px 2px 4px; border-radius: 999px; background: rgba(10,7,5,.72); border: 1px solid rgba(240,207,134,.25); font-variant-numeric: tabular-nums; }
.chips b { font-size: 14px; }
.chips-sm b { font-size: 12px; }
.chip-stack { position: relative; width: 16px; height: 16px; }
.chip-stack i { position: absolute; left: 0; bottom: calc(var(--i) * 2.5px); width: 16px; height: 6px; border-radius: 50%; background: #b8332d; border: 1.5px dashed #f1e8d6; box-shadow: 0 1px 0 #5a1612; }
.chip-stack i:nth-child(2n) { background: #1d3561; }
.chip-stack i:nth-child(3n) { background: #1f5a43; }
.bet-spot { position: absolute; transform: translate(-50%, -50%); z-index: 2; transition: left .3s, top .3s; }

.pseat { width: 76px; }
.pseat .seat-avatar .avatar { width: 40px; height: 40px; }
.pplate { grid-template-columns: 1fr; text-align: center; gap: 0; padding: 3px 5px 4px; }
.pplate .seat-name { font-size: 12px; }
.seat-stack { font-size: 13px; font-weight: 600; color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.pseat.is-folded .seat-avatar { filter: brightness(.55) saturate(.5); }
.pseat.is-folded .pplate { opacity: .6; }
.pseat.is-out { opacity: .4; }
.pseat.is-winner .seat-avatar { box-shadow: 0 0 0 2px var(--brass-hi), 0 0 26px rgba(240,207,134,.7); }
.dealer-btn { position: absolute; left: -8px; top: -4px; width: 20px; height: 20px; border-radius: 50%; display: grid; place-items: center; background: #f6eedc; color: #1c1714; font-size: 11px; font-weight: 700; box-shadow: 0 2px 4px rgba(0,0,0,.5); border: 1px solid #b8a37a; }
.dealer-btn.inline { position: static; display: inline-grid; width: 18px; height: 18px; font-size: 10px; vertical-align: middle; margin-left: 4px; }
.seat-hole { position: absolute; right: -14px; bottom: -2px; display: flex; }
.seat-hole .pc { --cw: 17px; border-width: 1px; }
.seat-hole .pc + .pc { margin-left: -9px; transform: rotate(10deg); }
.act-bubble { position: absolute; top: -10px; left: 50%; transform: translateX(-50%); white-space: nowrap; padding: 1px 7px; border-radius: 999px; font-size: 11px; font-weight: 700; background: var(--card); color: var(--card-ink); box-shadow: 0 2px 5px rgba(0,0,0,.45); animation: chip .3s ease-out; z-index: 2; }
.act-bubble.is-fold { background: #4a3e35; color: var(--ink-2); }
.act-bubble.is-raise { background: var(--brass); color: var(--brass-ink); }
.shown { display: flex; gap: 2px; margin-top: 2px; animation: rise .35s ease-out; }
.shown .pc { --cw: 30px; }

.pme { padding-top: 4px; }
.pme-row { display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; max-width: 900px; margin: 0 auto; }
.me-stack { font-size: 14px; color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.my-hole { display: flex; gap: 0; }
.hole-card { animation: dealin .4s cubic-bezier(.2,.8,.2,1) backwards; animation-delay: calc(var(--i) * 120ms); }
.hole-card .pc { --cw: var(--hand-cw); }
.hole-card + .hole-card { margin-left: calc(var(--hand-cw) * -.28); transform: rotate(6deg) translateY(4px); }
.hole-card:first-child { transform: rotate(-4deg); }
.my-hole.is-folded { filter: brightness(.45) saturate(.4); }
.my-hand { color: var(--ink); font-weight: 600; }
.pme.is-winner .me-id .avatar { box-shadow: 0 0 0 2px var(--brass-hi), 0 0 20px rgba(240,207,134,.7); }
.raise-panel { max-width: 560px; margin: 6px auto 0; padding: 10px; border-radius: 14px; background: rgba(0,0,0,.35); border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 8px; }
.raise-presets { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.raise-slider { display: flex; align-items: center; gap: 8px; }
.raise-slider input { flex: 1; width: auto; }
.history { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.history li { padding: 10px 12px; border-radius: 12px; background: rgba(0,0,0,.22); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 6px; }
.hist-top { display: flex; justify-content: space-between; gap: 8px; }
.hist-pot { margin: 0; }
.hist-shown { display: flex; flex-wrap: wrap; gap: 10px; }
.hist-player { display: flex; flex-direction: column; gap: 2px; }
.hist-player small { color: var(--ink-3); }
@media (min-width: 900px) {
  .pseat { width: 104px; }
  .pseat .seat-avatar .avatar { width: 48px; height: 48px; }
  .poker-screen { --board-cw: 78px; }
  .seat-hole .pc { --cw: 22px; }
  .shown .pc { --cw: 40px; }
}
/* poker layout refinements */
.pstage .felt { inset: 7% 6% 5%; }
.poker-center { padding-top: 0; }
.poker-screen { --board-cw: clamp(34px, 9.6vw, 74px); }
.result-line { max-width: 64%; padding: 0; font-size: 14px; }
@media (max-width: 899px) {
  .pseat { width: 70px; }
  .pseat .seat-avatar .avatar { width: 34px; height: 34px; }
  .pplate { padding: 2px 4px 3px; }
  .seat-hole { right: -10px; }
  .seat-hole .pc { --cw: 14px; }
  .act-bubble { font-size: 10px; top: -12px; }
  .shown .pc { --cw: 26px; }
}
@media (min-width: 900px) { .poker-screen { --board-cw: 78px; } }
.poker-screen { --board-cw: clamp(32px, 8.6vw, 74px); }
.poker-screen.cards-lg { --board-cw: clamp(36px, 9.6vw, 84px); }
.poker-center { padding-top: 6%; }
.pme .actions { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; max-width: 560px; margin-left: auto; margin-right: auto; }
.pme .actions .btn { padding-left: 8px; padding-right: 8px; letter-spacing: .04em; min-width: 0; white-space: normal; }
@media (min-width: 900px) { .poker-screen { --board-cw: 78px; } }
.poker-center { padding-top: 10%; }
.dealer-btn:not(.inline) { top: auto; bottom: 0; left: -10px; }

/* ================================================================== CLUB */
.tab { font-size: 11px; }
.outcome { border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line-2); background: rgba(0,0,0,.25); display: flex; flex-direction: column; gap: 4px; animation: rise .35s ease-out; }
.outcome-good { border-color: rgba(240,207,134,.6); background: linear-gradient(180deg, rgba(212,169,79,.18), rgba(212,169,79,.05)); }
.outcome-bad { border-color: rgba(224,86,63,.45); background: rgba(120,24,16,.18); }
.outcome-head { font-size: 24px; margin: 0; color: var(--brass-hi); }
.outcome-bad .outcome-head { color: #ffb4a3; }
.outcome-line { margin: 0; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.emblem { flex: none; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }

.my-standing { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
.standing-chip { display: inline-flex; align-items: baseline; gap: 8px; padding: 6px 12px; border-radius: 999px; background: rgba(0,0,0,.3); border: 1px solid var(--line); font-variant-numeric: tabular-nums; }
.standing-chip small { color: var(--ink-3); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; }
.standing-chip b { font-size: 18px; color: var(--brass-hi); }
.standing-chip em { font-style: normal; color: var(--ink-2); font-size: 13px; }

.belts { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 760px) { .belts { grid-template-columns: 1fr 1fr; } }
.belt-card { border-radius: 16px; padding: 16px; border: 1px solid var(--line-2); display: flex; flex-direction: column; gap: 12px; min-width: 0;
  background: radial-gradient(ellipse at 15% 0%, rgba(240,207,134,.14), transparent 60%), linear-gradient(180deg, var(--panel), var(--room-2)); }
.belt-card.is-mine { border-color: var(--brass); box-shadow: 0 0 0 1px rgba(240,207,134,.3), 0 0 30px rgba(212,169,79,.18); }
.belt-top { display: flex; gap: 12px; align-items: center; min-width: 0; }
.belt-top .eyebrow { margin-bottom: 4px; }
.belt-holder { display: flex; align-items: center; gap: 10px; background: none; border: 0; padding: 0; text-align: left; min-width: 0; }
.belt-holder .avatar { border-radius: 50%; box-shadow: 0 0 0 2px var(--brass); flex: none; }
.belt-holder span { display: flex; flex-direction: column; min-width: 0; }
.belt-holder small { color: var(--ink-3); font-size: 13px; }
.belt-action { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.belt-action p { margin: 0; }

.cup-panel { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
.cup-panel p { margin: 0; }
.cup-head { display: flex; gap: 12px; align-items: center; }
.heats { display: flex; flex-direction: column; gap: 10px; width: 100%; }
.heat small { text-transform: uppercase; letter-spacing: .12em; color: var(--ink-3); font-size: 11px; }
.heat-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
.heat-chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 3px; border-radius: 999px; background: rgba(0,0,0,.3); border: 1px solid var(--line); font-size: 14px; }
.heat-chip .avatar { border-radius: 50%; }
.heat-chip.is-me { border-color: var(--brass); color: var(--brass-hi); }
.ed { text-transform: none; letter-spacing: 0; color: var(--ink-3); font-weight: 400; }

.ladder { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; }
.ladder-row { width: 100%; display: grid; grid-template-columns: 2.2ch auto 1fr auto auto; align-items: center; gap: 10px; padding: 8px 12px; background: none; border: 0; border-bottom: 1px solid var(--line); text-align: left; }
.ladder li:last-child .ladder-row { border-bottom: 0; }
.ladder-row:hover { background: rgba(255,255,255,.04); }
.ladder-row.is-me { background: rgba(212,169,79,.12); }
.ladder-row .avatar { border-radius: 50%; }
.ladder-rank { font-family: var(--f-display); color: var(--brass-hi); text-align: right; font-variant-numeric: tabular-nums; }
.ladder-name { display: flex; flex-direction: column; min-width: 0; }
.ladder-name b { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ladder-name small { color: var(--ink-3); font-size: 13px; }
.ladder-rating { font-weight: 600; font-variant-numeric: tabular-nums; }
.club .sec-row .row-setting { border: 0; padding: 0; flex: none; }
.club .sec-row .row-text { display: none; }

.news { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.news-item { padding: 9px 12px; border-radius: 10px; background: rgba(255,255,255,.02); border-left: 3px solid var(--line-2); font-size: 15px; }
.news-title { border-left-color: var(--brass); }
.news-cup { border-left-color: var(--felt-hi); }
.news-item.is-me { background: rgba(212,169,79,.08); }

.member-head { display: flex; align-items: center; gap: 14px; }
.member-head p { margin: 0 0 6px; }
.member-games { display: grid; gap: 14px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .member-games { grid-template-columns: 1fr 1fr; } }
.mg { padding: 12px; border-radius: 12px; background: rgba(0,0,0,.2); border: 1px solid var(--line); min-width: 0; }
.mg .statgrid dd { font-size: 22px; }
.h2h { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
.h2h b { color: var(--ink); }

.shelf { display: flex; flex-direction: column; gap: 10px; }
.trophy { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 12px; background: linear-gradient(180deg, rgba(58,36,20,.6), rgba(30,20,14,.6)); border: 1px solid var(--line); }
.trophy.is-current { border-color: var(--brass); box-shadow: inset 0 0 24px rgba(212,169,79,.12); }
.trophy.is-past { opacity: .8; }
.trophy-text { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.trophy-text small, .reign small { color: var(--ink-3); font-size: 13px; }
.reign { display: flex; flex-direction: column; }
.past-label { text-transform: uppercase; letter-spacing: .1em; font-size: 11px !important; }

.rivals { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.rival { width: 100%; display: grid; grid-template-columns: auto 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: rgba(0,0,0,.2); border: 1px solid var(--line); text-align: left; }
.rival .avatar { border-radius: 50%; }
.rival span { display: flex; flex-direction: column; min-width: 0; }
.rival small { color: var(--ink-3); font-size: 13px; }
.rival-score { font-family: var(--f-display); font-size: 22px; }
.rival-score.is-up { color: var(--good); }
.rival-score.is-down { color: #ff9a85; }

.seat-picker { display: flex; flex-direction: column; gap: 8px; }
.seat-picker .row-setting { border-bottom: 0; padding-top: 0; }
.seat-row { display: flex; flex-wrap: wrap; gap: 8px; }
.seat-chip { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 72px; padding: 8px 4px; border-radius: 12px; background: rgba(0,0,0,.25); border: 1px solid var(--line); }
.seat-chip .avatar { border-radius: 50%; }
.seat-chip-name { font-size: 13px; font-weight: 600; }
.seat-chip-meta { font-size: 12px; color: var(--brass-hi); font-variant-numeric: tabular-nums; }
.event-strip { margin-top: 10px; width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 12px; background: rgba(212,169,79,.08); border: 1px solid rgba(212,169,79,.35); text-align: left; }
.event-strip span:first-child { display: flex; flex-direction: column; min-width: 0; }
.event-strip small { color: var(--ink-2); font-size: 14px; }

.champ-strip { display: grid; gap: 10px; grid-template-columns: 1fr; }
@media (min-width: 640px) { .champ-strip { grid-template-columns: 1fr 1fr; } }
.champ { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid var(--line-2); background: linear-gradient(90deg, rgba(212,169,79,.1), transparent 70%); text-align: left; min-width: 0; }
.champ .avatar { border-radius: 50%; box-shadow: 0 0 0 2px var(--brass); flex: none; }
.champ > span { display: flex; flex-direction: column; min-width: 0; }
.champ small { font-size: 11px; text-transform: uppercase; letter-spacing: .12em; color: var(--brass); }
.champ em { font-style: normal; font-size: 13px; color: var(--ink-3); }
.champ.is-mine { border-color: var(--brass); }

/* avatars are now portraits cropped from the full-body character */
.avatar { display: inline-block; border-radius: 50%; overflow: hidden; flex: none; position: relative; vertical-align: middle; background-image: radial-gradient(circle at 50% 30%, rgba(255,255,255,.12), transparent 70%); }
.avatar > svg { display: block; }
.character { display: block; overflow: visible; }

/* card backs from the wardrobe */
.cb-back-oxblood { --back: #6a1d25; }
.cb-back-navy { --back: #1d2b4d; }
.cb-back-forest { --back: #1c4535; }
.cb-back-gold .pc-back { background: repeating-radial-gradient(circle at 50% 50%, rgba(255,240,200,.25) 0 2px, transparent 2px 6px), linear-gradient(135deg, #8a6a2a, #c9a24a 50%, #7a5a1a); }
.cb-back-deco .pc-back { background: repeating-linear-gradient(90deg, transparent 0 5px, rgba(226,189,104,.5) 5px 6px), repeating-linear-gradient(0deg, transparent 0 10px, rgba(226,189,104,.35) 10px 11px), #14161c; }
.cb-back-champion .pc-back { background: radial-gradient(circle, rgba(240,207,134,.45) 0 18%, transparent 19%), repeating-linear-gradient(45deg, rgba(240,207,134,.18) 0 2px, transparent 2px 7px), #4a1414; }

/* ================================================== CHARACTERS, WARDROBE, SHOP */
.dressing-stage {
  position: relative; display: block; width: 100%; max-width: 240px; aspect-ratio: 200 / 410; margin: 0 auto;
  border: 0; padding: 6px 10px 0; background:
    radial-gradient(ellipse 60% 45% at 50% 28%, rgba(255,214,140,.22), transparent 70%),
    radial-gradient(ellipse 70% 12% at 50% 96%, rgba(0,0,0,.45), transparent 70%);
}
.dressing-stage.small { max-width: 190px; }

  max-width: 300px; border-radius: 140px 140px 18px 18px; padding: 18px 18px 6px;
  border: 3px solid var(--brass); box-shadow: inset 0 0 0 6px rgba(0,0,0,.35), inset 0 0 50px rgba(0,0,0,.5), 0 10px 30px rgba(0,0,0,.5);

    radial-gradient(ellipse 70% 50% at 50% 25%, rgba(255,230,180,.16), transparent 70%),

.home-hero-art.dressing-stage { width: 150px; max-width: 150px; }
@media (min-width: 700px) { .home-hero-art.dressing-stage { width: 200px; max-width: 200px; } }
@media (max-width: 520px) { .home-hero-art.dressing-stage { width: 160px; } }
.home-hero .levelbar { justify-content: flex-start; }
@media (max-width: 520px) { .home-hero .levelbar { justify-content: center; } }
button.balance { cursor: pointer; color: var(--ink); }

.profile-head { display: grid; grid-template-columns: minmax(130px, 200px) 1fr; gap: 18px; align-items: end; }
.profile-head .dressing-stage { max-width: 200px; }
.profile-info { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
